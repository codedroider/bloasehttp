name: Test Proxy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Start Target HTTP/HTTPS Web Server
      run: |
        node -e "
        const http = require('http');
        http.createServer((req, res) => {
          res.writeHead(200, { 'Content-Type': 'text/plain' });
          res.end('HELLO_FROM_TARGET_SERVER');
        }).listen(5050);
        " &
        echo "Waiting for mock target server..."
        sleep 2

    - name: Start Proxy Server
      run: |
        chmod +x run_server.sh
        ./run_server.sh &
        echo "Waiting for proxy server..."
        sleep 2

    - name: Start Proxy Client
      run: |
        node client.js &
        echo "Waiting for proxy client..."
        sleep 2

    - name: Run Integration Test
      run: |
        RESPONSE=$(curl -s -x http://127.0.0.1:8080 http://127.0.0.1:5050)
        echo "Response via proxy tunnel:"
        echo "$RESPONSE"
        
        if [ "$RESPONSE" = "HELLO_FROM_TARGET_SERVER" ]; then
          echo "Test passed!"
          exit 0
        else
          echo "Test failed!"
          exit 1
        fi
